<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="선택한 검역자원 배분 시나리오의 결과 화면 검토안" />
    <title>시나리오 분석 | 인천항 검역 시스템</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="proposal.css" />
  </head>
  <body>
    <div class="contour-map" aria-hidden="true">
      <canvas class="contour-map__canvas"></canvas>
    </div>
    <a class="skip-link" href="#main">본문으로 건너뛰기</a>
    <header class="site-header">
      <div class="header-inner results-header">
        <a class="brand" href="index.html" aria-label="인천항 검역 시스템 첫 화면">
          <img src="incheon_port_logo.png" alt="인천항만공사 로고" />
          <span class="brand-divider" aria-hidden="true"></span>
          <span class="brand-title">인천항 검역 시스템</span>
        </a>
        <a class="results-header-link" href="index.html">입력 화면으로</a>
      </div>
    </header>

    <main id="main">
      <section class="results-page section-wrap" aria-labelledby="results-title">
        <a class="back-link" href="index.html"><span aria-hidden="true">←</span> 항만과 시나리오 선택으로 돌아가기</a>
        <div class="results-heading">
          <p class="section-kicker">검역자원 배분 시나리오</p>
          <h1 id="results-title">생태위협 우선</h1>
          <p class="results-subtitle">선택한 분석 조건과 검역자원 배분 시나리오</p>
        </div>

        <section class="input-summary-card" aria-label="선택한 분석 조건">
          <div class="input-summary-item">
            <span>분석 시점</span>
            <strong id="result-period">-</strong>
          </div>
          <div class="input-summary-item">
            <span>항만</span>
            <strong id="result-port">-</strong>
          </div>
          <div class="input-summary-item">
            <span>국가</span>
            <strong id="result-country">-</strong>
          </div>
          <div class="input-summary-item">
            <span>월별 물동량</span>
            <strong id="result-volume">-</strong>
          </div>
        </section>

        <section class="results-layout" aria-label="시나리오별 배분 화면">
          <nav class="scenario-tabs" aria-label="시나리오 화면">
            <p class="scenario-tabs-label">시나리오</p>
            <button class="scenario-tab" type="button" data-scenario="ecology" aria-pressed="false">
              <strong>생태위협 우선</strong><b aria-hidden="true">→</b>
            </button>
            <button class="scenario-tab" type="button" data-scenario="balanced" aria-pressed="false">
              <strong>균형형</strong><b aria-hidden="true">→</b>
            </button>
            <button class="scenario-tab" type="button" data-scenario="volume" aria-pressed="false">
              <strong>물동량 우선</strong><b aria-hidden="true">→</b>
            </button>
            <a class="edit-input-link" href="index.html">입력 조건 수정</a>
          </nav>

          <section class="allocation-card" aria-labelledby="allocation-heading">
            <div class="allocation-card-heading">
              <div>
                <p class="panel-label">검역자원 배분</p>
                <h2 id="allocation-heading">검역자원 배분 결과</h2>
              </div>
              <span class="allocation-status">모델 미연결</span>
            </div>
            <p class="scenario-explanation" id="scenario-explanation"></p>
            <div class="allocation-empty-state" role="status" aria-live="polite">
              <span class="empty-state-symbol" aria-hidden="true">
                <svg viewBox="0 0 32 32" focusable="false">
                  <path d="M6 7v18h20M11 19l5-5 4 3 6-8" />
                  <circle cx="26" cy="9" r="1.5" />
                </svg>
              </span>
              <p class="empty-state-title">실제 배분 결과가 아직 없습니다</p>
              <p class="empty-state-description">계산 모델이 연결되면 선택한 분석 조건과 시나리오에 따른 결과가 이곳에 표시됩니다.</p>
            </div>
          </section>
        </section>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <span class="footer-brand">INCHEON PORT <i>·</i> BIOSECURITY</span>
        <span class="footer-note">항만별 검역 자원 배분 시나리오</span>
      </div>
    </footer>
    <script src="ports.js"></script>
    <script src="contour.js"></script>
    <script src="results.js"></script>
  </body>
</html>
